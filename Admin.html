
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPOROKOSO MUSIC AWARDS | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
header{text-align:center;padding:25px 10px}
h1,h2{color:#e8bd45}
.container{max-width:850px;margin:auto}
.panel{background:#171717;padding:22px;border-radius:12px;margin:15px 0;border:1px solid #333}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #555;border-radius:7px;background:#222;color:white;font-size:16px}
button{padding:13px 20px;background:#d6a92e;color:#080808;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin:7px 0}
button:disabled{opacity:.5}
.hidden{display:none}
.artist{background:#242424;padding:15px;margin:10px 0;border-radius:8px;border-left:4px solid #d6a92e;overflow-wrap:anywhere}
.muted{color:#aaa}
#message,#status{color:#f1ca58;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<header>
<h1>MPOROKOSO MUSIC AWARDS</h1>
<p>2027 OFFICIAL ADMINISTRATION</p>
</header>

<section id="loginPanel" class="panel">
<h2>Administrator Login</h2>
<p class="muted">Authorized administrators only.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h2>Admin Dashboard</h2>
<p>Welcome, Administrator.</p>
<h3>Total Registered Artists: <span id="total">0</span></h3>
<input id="search" type="search" placeholder="Search artist, name or phone">
<button id="refreshBtn">REFRESH ARTISTS</button>
<button id="logoutBtn">LOG OUT</button>
<p id="status"></p>
</div>
<div class="panel">
<h2>Registered Artists</h2>
<div id="artists"></div>
</div>
</section>
</div>

<script>
const SUPABASE_URL =
'https://qexskbpmkvglgavziagl.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_t79SjLFUSnEYETCeC7h14w_MENglbGA';

const loginPanel=document.getElementById('loginPanel');
const dashboard=document.getElementById('dashboard');
const message=document.getElementById('message');
const status=document.getElementById('status');
const artistsBox=document.getElementById('artists');

let db;

function showLogin(){
 loginPanel.classList.remove('hidden');
 dashboard.classList.add('hidden');
}
function showDashboard(){
 loginPanel.classList.add('hidden');
 dashboard.classList.remove('hidden');
}

async function loadArtists(){
 status.textContent='Loading registrations...';
 artistsBox.replaceChildren();

 try{
  const {data,error}=await db
   .from('Artists _registration')
   .select('id, artist, name, phone')
   .order('id',{ascending:false});

  if(error){
   status.textContent='Database error: '+error.message;
   return;
  }

  document.getElementById('total').textContent=data.length;

  if(data.length===0){
   artistsBox.textContent='No artist registrations found.';
   status.textContent='';
   return;
  }

  data.forEach(item=>{
   const card=document.createElement('div');
   card.className='artist';
   const title=document.createElement('h3');
   title.textContent=item.artist||'Artist not specified';
   const name=document.createElement('p');
   name.textContent='Name: '+(item.name||'Not provided');
   const phone=document.createElement('p');
   phone.textContent='Phone: '+(item.phone||'Not provided');
   const id=document.createElement('small');
   id.textContent='Registration ID: '+item.id;
   card.append(title,name,phone,id);
   artistsBox.appendChild(card);
  });

  status.textContent='Registrations loaded successfully.';
 }catch(error){
  status.textContent='Connection error: '+error.message;
 }
}

async function login(){
 const btn=document.getElementById('loginBtn');
 btn.disabled=true;
 message.textContent='Connecting to Supabase...';

 try{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;

  if(!email||!password){
   message.textContent='Please enter email and password.';
   return;
  }

  const {data,error}=await db.auth.signInWithPassword({email,password});

  if(error){
   message.textContent='Login failed: '+error.message;
   return;
  }

  if(data.session){
   showDashboard();
   await loadArtists();
  }
 }catch(error){
  message.textContent='Connection failed: '+error.message;
 }finally{
  btn.disabled=false;
 }
}

document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('password').addEventListener('keydown',e=>{
 if(e.key==='Enter')login();
});
document.getElementById('refreshBtn').addEventListener('click',loadArtists);

document.getElementById('logoutBtn').addEventListener('click',async()=>{
 const {error}=await db.auth.signOut();
 if(error){
  status.textContent=error.message;
  return;
 }
 showLogin();
 message.textContent='You have logged out.';
});

document.getElementById('search').addEventListener('input',()=>{
 const term=document.getElementById('search').value.toLowerCase();
 document.querySelectorAll('.artist').forEach(card=>{
  card.style.display=card.textContent.toLowerCase().includes(term)?'block':'none';
 });
});

async function checkSession(){
 const {data,error}=await db.auth.getSession();
 if(error){
  message.textContent=error.message;
  return;
 }
 if(data.session){
  showDashboard();
  await loadArtists();
 }
}

try{
 if(!window.supabase)throw new Error('Supabase library did not load. Check internet.');
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
 checkSession();
}catch(error){
 message.textContent='Setup error: '+error.message;
}
</script>
</body>
</html>
