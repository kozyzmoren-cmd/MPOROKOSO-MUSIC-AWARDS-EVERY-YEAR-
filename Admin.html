<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPOROKOSO MUSIC AWARDS | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:1000px;margin:30px auto}
h1{color:gold;text-align:center}
.card{background:#171717;padding:20px;border-radius:12px;margin:15px 0}
input,button{padding:12px;margin:6px 0;width:100%;border-radius:6px;border:0}
button{background:gold;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #444;text-align:left}
.wrap{overflow-x:auto}
#dashboard{display:none}
#status{color:gold;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>MPOROKOSO MUSIC AWARDS 2027</h1>
<div class="card" id="login">
<h2>Administrator Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="loginAdmin()">LOGIN</button>
<p id="status"></p>
</div>

<div id="dashboard">
<div class="card">
<h2>Artist Registrations</h2>
<p id="count">Loading...</p>
<input id="search" placeholder="Search artists..." oninput="showArtists()">
<button onclick="loadArtists()">REFRESH</button>
<button onclick="logoutAdmin()">LOGOUT</button>
<p id="message"></p>
</div>
<div class="card wrap">
<table>
<thead>
<tr>
<th>ID</th><th>Artist</th><th>Name</th><th>Phone</th>
<th>Email</th><th>Province</th><th>Genre</th><th>Bio</th><th>Artist Name</th>
</tr>
</thead>
<tbody id="artists"></tbody>
</table>
</div>
</div>
</main>

<script>
const SUPABASE_URL = 'https://qexskbpmkvglgavziagl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_t79SjLFUSnEYETCeC7h14w_MENglbGA';

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let artistData = [];

async function loginAdmin(){
const status = document.getElementById('status');
status.textContent = 'Logging in...';

const {data,error} = await db.auth.signInWithPassword({
email:document.getElementById('email').value.trim(),
password:document.getElementById('password').value
});

if(error){
status.textContent = 'Login failed: ' + error.message;
return;
}

document.getElementById('login').style.display='none';
document.getElementById('dashboard').style.display='block';
loadArtists();
}

async function loadArtists(){
const message = document.getElementById('message');
message.textContent = 'Loading registrations...';

const {data,error} = await db
.from('Artists _registratin')
.select('*')
.order('id',{ascending:false});

if(error){
message.textContent = 'Database error: ' + error.message;
return;
}

artistData = data || [];
document.getElementById('count').textContent =
'Total registrations: ' + artistData.length;

message.textContent = 'Registrations loaded successfully.';
showArtists();
}

function showArtists(){
const search = document.getElementById('search').value.toLowerCase();
const tbody = document.getElementById('artists');

const filtered = artistData.filter(a =>
Object.values(a).some(v =>
String(v ?? '').toLowerCase().includes(search)
)
);

tbody.innerHTML = filtered.map(a => `
<tr>
<td>${safe(a.id)}</td>
<td>${safe(a.artist)}</td>
<td>${safe(a.name)}</td>
<td>${safe(a.phone)}</td>
<td>${safe(a.email)}</td>
<td>${safe(a.province)}</td>
<td>${safe(a.genre)}</td>
<td>${safe(a.bio)}</td>
<td>${safe(a['artist _Name'])}</td>
</tr>
`).join('');
}

function safe(value){
return String(value ?? '').replace(/[&<>"']/g, c => ({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

async function logoutAdmin(){
await db.auth.signOut();
location.reload();
}
</script>
</body>
</html>
