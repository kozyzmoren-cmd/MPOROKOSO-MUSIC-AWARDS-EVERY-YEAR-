<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPOROKOSO MUSIC AWARDS | ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
 padding:20px;
}
.container{max-width:1100px;margin:auto}
header{text-align:center;padding:20px}
h1{color:gold}
.card{
 background:#171717;
 padding:20px;
 border:1px solid #333;
 border-radius:12px;
 margin-bottom:20px;
}
input,button{
 width:100%;
 padding:13px;
 margin:8px 0;
 border-radius:7px;
 border:1px solid #444;
}
input{background:#222;color:white}
button{
 background:gold;
 color:black;
 font-weight:bold;
 cursor:pointer;
}
.logout{background:#b22222;color:white}
.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:15px;
}
.stat{
 background:#222;
 padding:20px;
 border-radius:10px;
 text-align:center;
}
.stat h2{color:gold}
table{
 width:100%;
 border-collapse:collapse;
 min-width:700px;
}
th,td{
 padding:12px;
 border:1px solid #444;
 text-align:left;
}
th{background:#292929;color:gold}
.table-wrap{overflow-x:auto}
#dashboard{display:none}
#message{color:gold}
</style>
</head>

<body>
<div class="container">

<header>
<h1>MPOROKOSO MUSIC AWARDS</h1>
<p>ADMINISTRATION DASHBOARD</p>
</header>

<!-- LOGIN -->
<div class="card" id="login">
<h2>Admin Login</h2>

<input type="email" id="email"
placeholder="Admin Email">

<input type="password" id="password"
placeholder="Password">

<button onclick="loginAdmin()">LOGIN</button>

<p id="message"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="card">
<h2>Welcome, Administrator</h2>
<button class="logout" onclick="logoutAdmin()">LOGOUT</button>
</div>

<div class="stats">
<div class="stat">
<h3>Total Registrations</h3>
<h2 id="total">0</h2>
</div>
</div>

<div class="card">
<h2>Registered Artists</h2>

<input type="text" id="search"
placeholder="Search artists..."
oninput="displayArtists()">

<button onclick="loadArtists()">REFRESH</button>

<p id="status"></p>

<div class="table-wrap">
<table>
<thead>
<tr id="headings"></tr>
</thead>
<tbody id="artistList"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>

// SUPABASE CONNECTION
const SUPABASE_URL = "https://qexskbpmkvglgavziagl.supabase.co";

const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_EMAIL = "kozyzmoren@gmail.com";

// TABLE NAME
const TABLE_NAME = "Artists _registration";

let artists = [];
let columns = [];

// LOGIN
async function loginAdmin(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

document.getElementById("message").innerText = "Please wait...";

if(email.toLowerCase() !== ADMIN_EMAIL){
document.getElementById("message").innerText =
"Access denied. Admin only.";
return;
}

const {data,error} = await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
document.getElementById("message").innerText = error.message;
return;
}

showDashboard();
}

// SHOW DASHBOARD
async function showDashboard(){

document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";

await loadArtists();
}

// LOAD ARTISTS
async function loadArtists(){

document.getElementById("status").innerText="Loading registrations...";

const {data,error} = await supabaseClient
.from(TABLE_NAME)
.select("*")
.order("id",{ascending:false});

if(error){
document.getElementById("status").innerText =
"Database error: "+error.message;
return;
}

artists=data || [];

columns=artists.length ? Object.keys(artists[0]) : [];

document.getElementById("total").innerText=artists.length;

displayArtists();

document.getElementById("status").innerText =
artists.length+" registrations found.";
}

// DISPLAY ARTISTS
function displayArtists(){

const search=document.getElementById("search").value.toLowerCase();

const filtered=artists.filter(artist =>
Object.values(artist).some(value =>
String(value ?? "").toLowerCase().includes(search)
)
);

const headings=document.getElementById("headings");
const list=document.getElementById("artistList");

headings.innerHTML="";
list.innerHTML="";

columns.forEach(column=>{
const th=document.createElement("th");
th.textContent=column.replaceAll("_"," ");
headings.appendChild(th);
});

filtered.forEach(artist=>{

const tr=document.createElement("tr");

columns.forEach(column=>{

const td=document.createElement("td");
td.textContent=artist[column] ?? "";
tr.appendChild(td);

});

list.appendChild(tr);

});

if(filtered.length===0){
list.innerHTML='<tr><td colspan="20">No artists found.</td></tr>';
}
}

// LOGOUT
async function logoutAdmin(){

await supabaseClient.auth.signOut();

artists=[];

document.getElementById("dashboard").style.display="none";
document.getElementById("login").style.display="block";

document.getElementById("password").value="";
document.getElementById("message").innerText="Logged out successfully.";

}

// CHECK EXISTING SESSION
async function checkSession(){

const {data} = await supabaseClient.auth.getSession();

if(data.session){

if(data.session.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
showDashboard();
}else{
await supabaseClient.auth.signOut();
}
}

}

checkSession();

</script>
</body>
</html>
