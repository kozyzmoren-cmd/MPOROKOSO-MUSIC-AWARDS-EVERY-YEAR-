<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mporokoso music awards | admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#b8860b;
 color:black;
 padding:22px;
 text-align:center;
}
.container{
 max-width:1100px;
 margin:25px auto;
 padding:15px;
}
.card{
 background:#171717;
 padding:20px;
 border-radius:12px;
 margin-bottom:20px;
}
input,button{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:0;
 border-radius:6px;
}
button{
 background:gold;
 color:black;
 font-weight:bold;
 cursor:pointer;
}
.logout{background:#b22222;color:white}
.stats{
 display:flex;
 gap:12px;
 flex-wrap:wrap;
}
.stat{
 background:#252525;
 padding:20px;
 border-radius:10px;
 flex:1;
 min-width:130px;
}
.stat h2{color:gold}
.table-wrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 min-width:650px;
}
th,td{
 border:1px solid #444;
 padding:12px;
 text-align:left;
}
th{background:#b8860b;color:black}
tr:nth-child(even){background:#222}
#dashboard{display:none}
#message{color:gold}
</style>
</head>

<body>

<header>
<h1>mporokoso music awards 2027</h1>
<h3>administration dashboard</h3>
</header>

<div class="container">

<div class="card" id="login">
<h2>administrator login</h2>
<input type="email" id="email" placeholder="admin email">
<input type="password" id="password" placeholder="password">
<button onclick="login_admin()">login</button>
<p id="message"></p>
</div>

<div id="dashboard">

<div class="card">
<h2>welcome administrator</h2>
<button class="logout" onclick="logout_admin()">log out</button>
</div>

<div class="stats">
<div class="stat">
<h3>total artists</h3>
<h2 id="total">0</h2>
</div>
<div class="stat">
<h3>provinces</h3>
<h2 id="provinces">0</h2>
</div>
<div class="stat">
<h3>genres</h3>
<h2 id="genres">0</h2>
</div>
</div>

<div class="card">
<h2>registered artists</h2>

<input id="search"
placeholder="search artist, phone, email or province..."
oninput="search_artists()">

<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="artistRows"></tbody>
</table>
</div>

<p id="status"></p>
</div>

</div>
</div>

<script>
const supabase_url =
'https://qexskbpmkvglgavziagl.supabase.co';

const supabase_key =
'sb_publishable_t79SjLFUSnEYETCeC7h14w_MENglbGA';

const admin_email = 'kozyzmoren@gmail.com';

const db = window.supabase.createClient(
supabase_url,
supabase_key
);

let artists = [];

async function login_admin(){

 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;
 const msg = document.getElementById('message');

 msg.textContent = 'logging in...';

 if(email.toLowerCase() !== admin_email.toLowerCase()){
 msg.textContent = 'this email is not authorized.';
 return;
 }

 const {data,error} = await db.auth.signInWithPassword({
 email: email,
 password: password
 });

 if(error){
 msg.textContent = error.message;
 return;
 }

 await show_dashboard();
}

async function show_dashboard(){

 const {data,error} = await db.auth.getUser();

 const user = data?.user;

 if(error || !user ||
 user.email?.toLowerCase() !== admin_email.toLowerCase()){

 await db.auth.signOut();

 document.getElementById('message').textContent =
 'administrator access denied.';

 return;
 }

 document.getElementById('login').style.display='none';
 document.getElementById('dashboard').style.display='block';

 await load_artists();
}

async function load_artists(){

 const status = document.getElementById('status');
 status.textContent = 'loading artists...';

 const {data,error} = await db
 .from('Artists _registration')
 .select('*');

 if(error){
 status.textContent = 'database error: '+error.message;
 return;
 }

 artists = data || [];

 document.getElementById('total').textContent =
 artists.length;

 document.getElementById('provinces').textContent =
 new Set(artists.map(a=>get_field(a,'province')).filter(Boolean)).size;

 document.getElementById('genres').textContent =
 new Set(artists.map(a=>get_field(a,'genre')).filter(Boolean)).size;

 render_artists(artists);

 status.textContent = 'artist records loaded successfully.';
}

function get_field(row,name){
 const key = Object.keys(row).find(
 k=>k.toLowerCase().replace(/[\s_-]/g,'') === name
 );
 return key ? row[key] : '';
}

function render_artists(list){

 const head = document.getElementById('tableHead');
 const rows = document.getElementById('artistRows');

 const columns = Object.keys(artists[0] || {});

 head.innerHTML = '<tr>' +
 columns.map(c=>'<th>'+escape_html(c)+'</th>').join('') +
 '</tr>';

 if(!list.length){
 rows.innerHTML =
 '<tr><td colspan="20">no registered artists found</td></tr>';
 return;
 }

 rows.innerHTML = list.map(a=>
 '<tr>' + columns.map(c=>
 '<td>'+escape_html(a[c])+'</td>'
 ).join('') + '</tr>'
 ).join('');
}

function search_artists(){

 const q = document.getElementById('search').value.toLowerCase();

 const filtered = artists.filter(a=>
 Object.values(a).some(v=>
 String(v ?? '').toLowerCase().includes(q)
 )
 );

 render_artists(filtered);
}

function escape_html(value){

 return String(value ?? '').replace(/[&<>"']/g,
 c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
 }[c]));
}

async function logout_admin(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(async ({data,error})=>{

 if(error) return;

 if(data.session){
 await show_dashboard();
 }

});

</script>

</body>
</html>
